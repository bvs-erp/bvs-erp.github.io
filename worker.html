<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a78d6">
<title>BVS 공수</title>
<style>
:root{--bg:#f4f5f7;--sf:#fff;--sf2:#f6f7f9;--ln:#e3e6eb;--tx:#101216;--tx2:#4b5159;--tx3:#8a919c;--ac:#2a78d6;--ac2:#e9f1fc;--good:#0ca30c;--goodbg:#e8f7e8;--warn:#b57800;--warnbg:#fff6df;--crit:#d03b3b;--critbg:#fdecec;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#121315;--sf:#1a1b1e;--sf2:#202226;--ln:#2b2e34;--tx:#f2f3f5;--tx2:#b8bcc4;--tx3:#7d838d;--ac:#3987e5;--ac2:#1b2a40;--good:#3cc13c;--goodbg:#173a17;--warn:#fab219;--warnbg:#3a2e12;--crit:#ef6b6b;--critbg:#3d1d1d}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.pos{color:var(--good)}.neg{color:var(--crit)}.wn{color:var(--warn)}.dim{color:var(--tx3)}.tiny{font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px}
.in{width:100%;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf2);outline:none;font-size:16px}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
textarea.in{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-weight:600;min-height:48px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.w{width:100%}.btn.d{color:var(--crit)}.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:24px;border:1px solid var(--ln);background:var(--sf2);cursor:pointer;font-size:15px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.step{display:flex;align-items:center;gap:10px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);font-size:22px;cursor:pointer}
.step .v{flex:1;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--sf2);border:1px solid var(--ln);color:var(--tx2)}
.pill.b{background:var(--ac2);border-color:transparent;color:var(--ac)}.pill.g{background:var(--goodbg);border-color:transparent;color:var(--good)}.pill.y{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.item .d{min-width:52px;text-align:center}.item .d b{display:block;font-size:18px;line-height:1.1}.item .d small{color:var(--tx3);font-size:12px}
.item .m{flex:1;min-width:0}.item .m .s{font-weight:600}.item .m .t{font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-variant-numeric:tabular-nums}.item .r b{display:block;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.kpi .k{font-size:12px;color:var(--tx3)}.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#1baf7a);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.top .nm{flex:1}.top .nm b{display:block}.top .nm small{color:var(--tx3)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs div{flex:1;text-align:center;padding:10px 0 8px;font-size:12px;color:var(--tx3);cursor:pointer}
.tabs div.on{color:var(--ac);font-weight:600}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
.page{display:none}.page.on{display:block}
#toasts{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;text-align:center}
.toast.e{background:var(--crit);color:#fff}.toast.g{background:var(--good);color:#fff}
.empty{color:var(--tx3);text-align:center;padding:20px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 -->
  <div id="gate">
    <div class="top"><div class="lg">BV</div><div class="nm"><b>BVS 공수</b><small>비브이에스 현장 근무 기록</small></div></div>
    <div class="card" id="loginCard">
      <div class="f"><label>이메일</label><input id="email" class="in" type="email" autocomplete="username" inputmode="email"></div>
      <div class="f"><label>비밀번호</label><input id="pw" class="in" type="password" autocomplete="current-password"></div>
      <label class="tiny dim" style="display:block;margin:-4px 0 12px"><input type="checkbox" onchange="el('pw').type=this.checked?'text':'password'"> 비밀번호 보기</label>
      <button class="btn p w" onclick="doLogin()">로그인</button>
      <div class="msg" id="lmsg"></div>
    </div>
    <div class="card hide" id="pwCard">
      <h2>새 비밀번호 설정</h2>
      <p class="tiny dim" id="pwWhy">최초 로그인입니다. 비밀번호를 새로 정하셔야 자료가 열립니다.</p>
      <div class="f"><label>새 비밀번호 (6자 이상)</label><input id="npw" class="in" type="password" autocomplete="new-password"></div>
      <div class="f"><label>다시 입력</label><input id="npw2" class="in" type="password" autocomplete="new-password"></div>
      <button class="btn p w" onclick="doChangePw()">저장</button>
      <div class="msg" id="pmsg"></div>
    </div>
    <p class="tiny dim" style="text-align:center">휴대폰 홈 화면에 추가해 두면 앱처럼 열립니다.</p>
  </div>

  <!-- 앱 -->
  <div id="app" class="hide">
    <div class="top"><div class="lg">BV</div><div class="nm"><b id="uName">–</b><small id="uSub">–</small></div><button class="btn sm" onclick="doLogout()">로그아웃</button></div>

    <section class="page on" id="p-in">
      <div class="card">
        <h2 id="inTitle">오늘 공수 입력</h2>
        <div class="f"><label>일자</label><input id="w_date" class="in" type="date"></div>
        <div class="f"><label>현장</label><select id="w_site" class="in"></select></div>
        <div class="f"><label>업무 유형</label><div class="chips" id="w_pc"></div></div>
        <div class="f"><label>근무 시간 (내부 기준, 8시간 = 1공수)</label>
          <div class="step"><button onclick="hStep(-1)">−</button><div class="v"><span id="w_hours">8</span><small class="dim" style="font-size:13px"> 시간</small></div><button onclick="hStep(1)">＋</button></div>
          <div class="chips" style="margin-top:8px"><span class="chip" onclick="hSet(4)">4</span><span class="chip on" onclick="hSet(8)">8</span><span class="chip" onclick="hSet(9)">9</span><span class="chip" onclick="hSet(10)">10</span><span class="chip" onclick="hSet(12)">12</span></div></div>
        <div class="row2"><div class="f"><label>출근</label><input id="w_start" class="in" type="time"></div><div class="f"><label>퇴근</label><input id="w_end" class="in" type="time"></div></div>
        <div class="f"><label>업무 내용</label><textarea id="w_desc" class="in" placeholder="예: M15X 5EAL7005 반입, EFEM 레벨링"></textarea></div>
        <button class="btn p w" id="w_btn" onclick="submitLabor()">제출</button>
        <div class="msg" id="w_msg"></div>
      </div>
      <div class="note tiny">같은 날 같은 현장에 다시 제출하면 덮어씁니다. 7일 이전 기록이나 확정된 기록의 수정은 대표에게 요청하십시오.</div>
    </section>

    <section class="page" id="p-list">
      <div class="kpis" id="myKpi"></div>
      <div class="card"><h2>내 기록 <small class="dim" id="listN"></small></h2><div id="list"></div></div>
    </section>

    <section class="page" id="p-pay">
      <div class="card"><h2>월별 정산</h2><div id="pay"></div><p class="tiny dim" style="margin:12px 0 0">지급액은 대표 확정 후 다음 달 10일에 지급됩니다. 확정 전 금액은 바뀔 수 있습니다.</p></div>
    </section>
  </div>
</div>
<div class="tabs hide" id="tabs">
  <div class="on" data-p="in" onclick="go('in')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>입력</div>
  <div data-p="list" onclick="go('list')"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>기록</div>
  <div data-p="pay" onclick="go('pay')"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>정산</div>
</div>
<div id="toasts"></div>
<script>
var URL_='https://buchnmdsdjlcvqnjaaxe.supabase.co', KEY='sb_publishable_8IbvXKSyMvhVurvs-2ssLQ_Gj9Svfez', sb=null, ME=null;
var D={sites:[],labor:[],pay:[]}, HOURS=8, PC='PJ-SETUP';
var PCS=[['PJ-SETUP','장비셋업'],['PJ-PUMP','펌프실'],['PJ-TESMFG','TES제조'],['PJ-HQ','본사업무'],['PJ-EDU','교육'],['PJ-OFF','휴무·연차']];
var STMAP={draft:['임시',''],submitted:['제출','b'],approved:['확정','g'],settled:['정산완료','g'],void:['취소','']};
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function won(n){return (n==null||isNaN(n))?'–':Math.round(n).toLocaleString('ko-KR')}
function toast(m,c){var t=document.createElement('div');t.className='toast '+(c||'');t.textContent=m;el('toasts').appendChild(t);setTimeout(function(){t.remove()},c==='e'?5000:2800)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hhmm(t){if(!t)return '';var m=String(t).match(/(\d{2}):(\d{2})/);return m?m[1]+':'+m[2]:''}
window.onerror=function(m){toast('오류: '+m,'e')};

var CDN=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js'];
function loadLib(i){if(window.supabase&&window.supabase.createClient){boot();return}
  if(i>=CDN.length){el('lmsg').innerHTML='<span class="neg">연결 라이브러리를 못 받았습니다. 인터넷을 확인해 주세요.</span>';return}
  var s=document.createElement('script');s.src=CDN[i];s.onload=function(){boot()};s.onerror=function(){loadLib(i+1)};document.head.appendChild(s)}
async function boot(){sb=window.supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  try{var r=await sb.auth.getSession();if(r.data&&r.data.session){afterLogin()}else{try{el('email').value=localStorage.getItem('bvs_w_email')||''}catch(e){}}}catch(e){}}
async function doLogin(){var em=el('email').value.trim().toLowerCase(),pw=el('pw').value;var m=el('lmsg');
  if(!em||!pw){m.innerHTML='<span class="neg">이메일과 비밀번호를 넣어 주세요</span>';return}
  m.textContent='확인 중…';
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){m.innerHTML='<span class="neg">'+(/invalid/i.test(r.error.message)?'이메일 또는 비밀번호가 다릅니다':esc(r.error.message))+'</span>';return}
  try{localStorage.setItem('bvs_w_email',em)}catch(e){}
  el('pw').value='';m.textContent='';afterLogin();
}
async function afterLogin(){
  var r=await sb.rpc('my_status');
  if(r.error){toast('상태 확인 실패: '+r.error.message,'e');return}
  ME=r.data||{};
  try{sb.rpc('my_log_login',{p_user_agent:navigator.userAgent.slice(0,200)})}catch(e){}
  if(ME.status==='must_change_password'){el('loginCard').classList.add('hide');el('pwCard').classList.remove('hide');el('pwWhy').textContent=ME.message||'';return}
  if(ME.status!=='ok'){el('lmsg').innerHTML='<span class="neg">'+esc(ME.message||'사용할 수 없는 계정입니다')+'</span>';el('loginCard').classList.remove('hide');el('pwCard').classList.add('hide');return}
  el('gate').classList.add('hide');el('app').classList.remove('hide');el('tabs').classList.remove('hide');
  el('uName').textContent=ME.name||ME.email||'';el('uSub').textContent=(ME.employment_no?'ID '+ME.employment_no+' · ':'')+today();
  if(!el('w_date').value)el('w_date').value=today();
  el('w_pc').innerHTML=PCS.map(function(p){return '<span class="chip'+(p[0]===PC?' on':'')+'" data-v="'+p[0]+'" onclick="pcSet(\''+p[0]+'\')">'+p[1]+'</span>'}).join('');
  loadAll();
}
async function doChangePw(){var a=el('npw').value,b=el('npw2').value,m=el('pmsg');
  if(a.length<6){m.innerHTML='<span class="neg">6자 이상이어야 합니다</span>';return}
  if(a!==b){m.innerHTML='<span class="neg">두 입력이 다릅니다</span>';return}
  m.textContent='저장 중…';
  var r=await sb.auth.updateUser({password:a});
  if(r.error){m.innerHTML='<span class="neg">'+esc(r.error.message)+'</span>';return}
  var r2=await sb.rpc('my_password_changed');
  if(r2.error){m.innerHTML='<span class="neg">'+esc(r2.error.message)+'</span>';return}
  el('npw').value='';el('npw2').value='';toast('비밀번호를 바꿨습니다','g');afterLogin();
}
async function doLogout(){try{await sb.auth.signOut()}catch(e){}location.reload()}

async function loadAll(){
  var res=await Promise.all([sb.from('my_sites').select('*'),sb.from('my_labor').select('*').order('work_date',{ascending:false}).limit(120),sb.from('my_payslip').select('*').order('period_ym',{ascending:false}).limit(12)]);
  var errs=res.filter(function(r){return r.error}).map(function(r){return r.error.message});if(errs.length)toast(errs.join(' | '),'e');
  D.sites=res[0].data||[];D.labor=res[1].data||[];D.pay=res[2].data||[];
  var cur=el('w_site').value;
  var last=D.labor[0];var pref=cur||(last?last.site_id:'');
  el('w_site').innerHTML='<option value="">현장 선택</option>'+D.sites.map(function(s){return '<option value="'+esc(s.site_id)+'"'+(s.site_id===pref?' selected':'')+'>'+esc(s.site_name)+'</option>'}).join('');
  if(last&&!cur&&last.project_code&&!PC_touched)pcSet(last.project_code);
  renderList();renderPay();
}
var PC_touched=false;
function pcSet(v){PC=v;PC_touched=true;document.querySelectorAll('#w_pc .chip').forEach(function(c){c.classList.toggle('on',c.dataset.v===v)})}
function hSet(h){HOURS=h;el('w_hours').textContent=h;document.querySelectorAll('#p-in .chips:not(#w_pc) .chip').forEach(function(c){c.classList.toggle('on',+c.textContent===h)})}
function hStep(d){hSet(Math.max(0,Math.min(16,HOURS+d)))}
async function submitLabor(){var m=el('w_msg'),b=el('w_btn');
  if(!el('w_site').value){m.innerHTML='<span class="neg">현장을 선택해 주세요</span>';return}
  b.disabled=true;m.textContent='제출 중…';
  var p={work_date:el('w_date').value,site_id:el('w_site').value,project_code:PC,hours:HOURS,work_start:el('w_start').value||null,work_end:el('w_end').value||null,work_desc:el('w_desc').value||null};
  var r=await sb.rpc('op_submit_labor',{p:p});b.disabled=false;
  if(r.error||!r.data||!r.data.ok){m.innerHTML='<span class="neg">'+esc((r.error&&r.error.message)||(r.data&&r.data.error)||'실패')+'</span>';return}
  m.innerHTML='<span class="pos">'+(r.data.mode==='updated'?'수정 제출됨':'제출됨')+' · '+esc(el('w_date').value)+'</span>';toast('제출 완료','g');
  el('w_desc').value='';loadAll();
}
async function withdraw(id){if(!confirm('이 기록을 취소할까요?'))return;
  var r=await sb.rpc('op_withdraw_labor',{p_entry_id:id});
  if(r.error||!r.data||!r.data.ok){toast((r.error&&r.error.message)||(r.data&&r.data.error)||'실패','e');return}
  toast('취소됨');loadAll()}
function renderList(){
  var ym=today().slice(0,7),cur=D.labor.filter(function(r){return String(r.work_date).slice(0,7)===ym});
  var md=cur.reduce(function(a,r){return a+(+r.work_md||0)},0),ot=cur.reduce(function(a,r){return a+(+r.ot_hours||0)},0);
  el('myKpi').innerHTML='<div class="kpi"><div class="k">'+ym+' 근무일</div><div class="v">'+cur.length+'</div></div><div class="kpi"><div class="k">공수</div><div class="v">'+md.toFixed(1)+'</div></div><div class="kpi"><div class="k">잔업 h</div><div class="v">'+ot.toFixed(1)+'</div></div>';
  el('listN').textContent=D.labor.length?'최근 '+D.labor.length+'건':'';
  el('list').innerHTML=D.labor.length?D.labor.map(function(r){var st=STMAP[r.status]||[r.status,''];var d=String(r.work_date);
    return '<div class="item"><div class="d"><b>'+d.slice(8)+'</b><small>'+d.slice(5,7)+'월</small></div><div class="m"><div class="s">'+esc(r.site_name)+' <span class="pill '+st[1]+'">'+st[0]+'</span></div><div class="t">'+(r.work_start?hhmm(r.work_start)+'–'+hhmm(r.work_end)+' · ':'')+esc(r.work_desc||'')+'</div></div><div class="r"><b>'+(+r.work_md).toFixed(1)+'</b><small class="dim">'+((+r.ot_hours)>0?'+'+(+r.ot_hours)+'h':'공수')+'</small>'+(r.status==='submitted'&&!r.settled_ym?'<div><button class="btn sm d" style="margin-top:4px" onclick="withdraw('+r.entry_id+')">취소</button></div>':'')+'</div></div>'}).join(''):'<div class="empty">기록 없음</div>';
}
function renderPay(){
  el('pay').innerHTML=D.pay.length?D.pay.map(function(r){return '<div class="item"><div class="d"><b>'+String(r.period_ym).slice(5)+'</b><small>'+String(r.period_ym).slice(0,4)+'</small></div><div class="m"><div class="s">공수 '+(+r.work_md_sum).toFixed(1)+' · 잔업 '+(+r.ot_hours_sum||0)+'h <span class="pill '+(r.is_closed?'g':'y')+'">'+(r.is_closed?'확정':'집계 중')+'</span></div><div class="t">기본 '+won(r.base_amt)+' · 연장 '+won(r.ot_amt)+' · 수당 '+won(r.allowance_amt)+'</div></div><div class="r"><b>'+won(r.payable_amt)+'</b><small class="dim">원</small></div></div>'}).join(''):'<div class="empty">정산 자료 없음</div>';
}
function go(p){document.querySelectorAll('.page').forEach(function(x){x.classList.toggle('on',x.id==='p-'+p)});document.querySelectorAll('.tabs div').forEach(function(t){t.classList.toggle('on',t.dataset.p===p)});window.scrollTo(0,0);if(p!=='in')loadAll()}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!el('gate').classList.contains('hide')){if(!el('pwCard').classList.contains('hide'))doChangePw();else doLogin()}});
loadLib(0);
</script>
